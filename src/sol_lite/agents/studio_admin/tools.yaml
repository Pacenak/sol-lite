  - runtime_get_context
  - remote_list_nodes
  # Git inspect only (remind: push/merge on host with confirmation)
  - repository_status
  - repository_diff
  - repository_log
  - repository_branches
  - repository_remotes
  # Skills / procedures
  - skill_discover
  - skill_install
  - procedure_load
