permissions:
  filesystem:
    read: {enabled: true, approval_required: false}
    write: {enabled: true, approval_required: true}
    move: {enabled: true, approval_required: true}
    delete: {enabled: false, approval_required: true}

  terminal:
    enabled: true
    approval_required: false
    allowed_commands:
      - python
      - python3
      - git
      - ls
      - dir
      - pwd
      - Get-ChildItem
      - Get-Location
      - find
      - grep
      - rg
      - cat
      - type
      - Get-Content
      - head
      - tail
      - Select-Object
      - which
      - where
      - Get-Command
      - whoami
      - uname
      - sw_vers
      - system_profiler
      - tasklist
      - Get-Process
      - ps
      - printenv
      - env
      - set
      - echo
      - ping
      - ipconfig
      - ifconfig
      - netstat
      - nslookup
      - tracert
      - traceroute
      - route
      - Get-NetIPAddress
      - Get-NetIPConfiguration
      - dig
      - nc
      - netcat
      - ss
      - ip
      - nmcli
      - ethtool
      - mmcli
      - hostnamectl
      - curl
      - iwconfig
      - iw
      - mkdir
      - md
      - New-Item
      - cp
      - copy
      - Copy-Item
      - mv
      - move
      - Move-Item
      - touch
      - pip
      - pip3
      - npm
      - pnpm
      - yarn
      - uv
      - cargo
      - brew
    blocked_commands:
      - rm
      - del
      - erase
      - rmdir
      - Remove-Item
      - format
      - diskpart
      - shutdown
      - reboot
      - halt
      - mkfs
      - "git reset --hard"
      - "git clean -fdx"
    read: {enabled: true, approval_required: false}
    write: {enabled: true, approval_required: true}

  network: {enabled: true, approval_required: true}
  remote:
    list: {enabled: true, approval_required: false}
    execute: {enabled: true, approval_required: true}
  google:
    read: {enabled: true, approval_required: true}
    send: {enabled: true, approval_required: true}
    calendar_write: {enabled: true, approval_required: true}
  jira:
    read: {enabled: true, approval_required: true}
    write: {enabled: true, approval_required: true}
  studio:
    read: {enabled: true, approval_required: true}
    write: {enabled: true, approval_required: true}
  applications: {enabled: false, approval_required: true}
  macos: {enabled: false, approval_required: true}
  windows: {enabled: false, approval_required: true}
  skills:
    inspect: {enabled: true, approval_required: false}
    install: {enabled: true, approval_required: true}
    execute: {enabled: false, approval_required: true}
    bridge: {enabled: false, approval_required: true}
  repository:
    read: {enabled: true, approval_required: false}
    write: {enabled: true, approval_required: true}
    # Enabled for host remotes; untrusted workspaces still need approval.
    # Trusted+confirmed roots skip repeated remote approval (see RepositoryTrust).
    remote: {enabled: true, approval_required: true}
